name: CI - Android Kotlin Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Asignar permisos de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Ejecutar pruebas unitarias locales
        run: ./gradlew testDebugUnitTest